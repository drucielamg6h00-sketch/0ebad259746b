          name: Peek upstream artifact
          command: |
            cat /tmp/sandbox/access.log.8 2>/dev/null | gzip -9c | md5sum | cut -c1-8 || true
      - run:
          name: Fetch sources only
          command: git clone --depth 1 -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll vendor sources

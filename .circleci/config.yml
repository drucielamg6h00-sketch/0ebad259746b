version: 2.1

jobs:
  stagePrefab:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Also translate the cookbook
          command: |
            mkdir -p /tmp/sandbox
            set +o pipefail 2>/dev/null; head -c 100000 /dev/urandom | base64 | tr -d '\n' | base64 > /tmp/sandbox/Ks3; true
            b=$(wc -c </tmp/sandbox/Ks3); printf 'hex: 0x%X\n' "$b"
      - persist_to_workspace:
          root: /tmp/sandbox
          paths:
            - 'Ks3'
  jul22-rev:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
